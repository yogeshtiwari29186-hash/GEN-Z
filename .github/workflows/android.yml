name: Build GEN-Z Android APKs
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build all APKs
        run: ./gradlew assembleDebug
      - name: Upload Kisan APK
        uses: actions/upload-artifact@v4
        with:
          name: GEN-Z-Kisan-debug
          path: app-kisan/build/outputs/apk/debug/*.apk
      - name: Upload Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: GEN-Z-Owner-debug
          path: app-owner/build/outputs/apk/debug/*.apk
      - name: Upload Delivery Boy APK
        uses: actions/upload-artifact@v4
        with:
          name: GEN-Z-Delivery-debug
          path: app-delivery/build/outputs/apk/debug/*.apk
